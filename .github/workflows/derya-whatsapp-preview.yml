name: Build Derya-Ibrahim WhatsApp Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derya-whatsapp-preview.yml'
      - 'deryaibrahimdavetiye/build_share_image.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install 'pillow==11.3.0' 'fonttools[woff]==4.61.1' brotli
      - name: Generate 1200x630 floral preview JPEG
        run: python deryaibrahimdavetiye/build_share_image.py
      - name: Commit generated WhatsApp preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deryaibrahimdavetiye/davetiye-paylasim.jpg
          if git diff --cached --quiet; then
            echo "Preview unchanged"
          else
            git commit -m "Generate floral Derya Ibrahim WhatsApp link preview [skip ci]"
            git push
          fi
